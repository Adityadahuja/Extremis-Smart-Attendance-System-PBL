<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${studentDto.id != null ? 'Edit Student - Extremis Admin' : 'New Student - Extremis Admin'}">Student Form - Extremis</title>
  <link rel="stylesheet" href="/css/extremis.css">
</head>
<body>

  <!-- Top App Header -->
  <header class="app-header">
    <div class="brand-wrapper">
      <a href="/admin/students" style="color: #fff; font-size: 1.25rem; margin-right: 0.25rem;">&larr;</a>
      <div class="brand-name" th:text="${studentDto.id != null ? 'Edit Student' : 'Add Student'}">Student Form</div>
      <span class="brand-badge badge-admin">Admin</span>
    </div>
  </header>

  <main class="container" style="max-width: 520px; padding: 1.5rem 1rem;">

    <div th:if="${errorMessage}" class="alert alert-danger">
      <span style="font-size: 1.1rem;">⚠️</span>
      <span th:text="${errorMessage}">Error message</span>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 class="card-title" th:text="${studentDto.id != null ? 'Edit Student Information' : 'Register New Student'}">Student Information</h2>
      </div>

      <form th:action="@{/admin/students/save}" th:object="${studentDto}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
          <label class="form-label" for="username">Student Roll Number / Code *</label>
          <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="e.g. STU2024011" required>
          <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color: var(--danger); font-size: 0.78rem;">Error</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="fullName">Full Name *</label>
          <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="e.g. Rahul Sharma" required>
          <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" style="color: var(--danger); font-size: 0.78rem;">Error</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="department">Department *</label>
          <input type="text" id="department" th:field="*{department}" class="form-control" placeholder="e.g. Computer Science" required>
          <span th:if="${#fields.hasErrors('department')}" th:errors="*{department}" style="color: var(--danger); font-size: 0.78rem;">Error</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="collegeEmail">College Email</label>
          <input type="email" id="collegeEmail" th:field="*{collegeEmail}" class="form-control" placeholder="e.g. rahul.sharma@extremis.edu.in">
        </div>

        <div class="form-group">
          <label class="form-label" for="rtuRollNumber">RTU Roll Number</label>
          <input type="text" id="rtuRollNumber" th:field="*{rtuRollNumber}" class="form-control" placeholder="e.g. 24EARAD031">
        </div>

        <div class="form-group">
          <label class="form-label" for="branch">Branch</label>
          <input type="text" id="branch" th:field="*{branch}" class="form-control" placeholder="e.g. Artificial Intelligence">
        </div>

        <div class="form-group">
          <label class="form-label" for="section">Section</label>
          <input type="text" id="section" th:field="*{section}" class="form-control" placeholder="e.g. Section A">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            Password 
            <span th:if="${studentDto.id != null}" style="font-weight: 400; font-size: 0.8rem; color: var(--text-muted);">(Leave blank to keep current)</span>
            <span th:if="${studentDto.id == null}" style="font-weight: 400; font-size: 0.8rem; color: var(--text-muted);">(Default: StudentPassword123!)</span>
          </label>
          <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Set account password">
        </div>

        <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
          <a href="/admin/students" class="btn btn-secondary" style="flex: 1;">Cancel</a>
          <button type="submit" class="btn btn-primary" style="flex: 2;">Save Student</button>
        </div>

      </form>
    </div>

  </main>

  <script src="/js/extremis.js"></script>
</body>
</html>
