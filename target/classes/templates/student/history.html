<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance History - Extremis</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#dc2626">
  <link rel="stylesheet" href="/css/extremis.css">
</head>
<body>

  <!-- Top App Header -->
  <header class="app-header">
    <div class="brand-wrapper">
      <a href="/student/dashboard" style="color: #fff; font-size: 1.25rem; margin-right: 0.25rem;">&larr;</a>
      <div class="brand-name">History</div>
    </div>
    <div class="header-actions">
      <span class="user-profile-pill" th:text="${student.fullName}">Student</span>
      <form th:action="@{/student/logout}" method="post" style="display: inline;">
        <button type="submit" class="btn-logout">Exit</button>
      </form>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div class="card-header">
        <div>
          <h2 class="card-title">My Attendance Records</h2>
          <div class="card-subtitle" th:text="'Student: ' + ${student.fullName} + ' (' + ${student.username} + ')'">Student Info</div>
        </div>
        <span class="status-pill pill-info" th:text="${#lists.size(history)} + ' Records'">0 Records</span>
      </div>

      <div th:if="${#lists.isEmpty(history)}" style="text-align: center; padding: 2.5rem 1rem; color: var(--text-muted);">
        No verified attendance records found.
      </div>

      <div th:if="${!#lists.isEmpty(history)}" class="table-wrapper">
        <table class="table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Check In Time</th>
              <th>GPS Location</th>
              <th>Check Out Time</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="att : ${history}">
              <td><strong th:text="${att.date}">2026-10-10</strong></td>
              <td th:text="${#temporals.format(att.checkInTime, 'hh:mm a')}">09:15 AM</td>
              <td>
                <span th:if="${att.checkInLat != null}" style="font-size: 0.78rem; color: var(--text-muted);"
                      th:text="${#numbers.formatDecimal(att.checkInLat, 1, 4)} + ', ' + ${#numbers.formatDecimal(att.checkInLng, 1, 4)}">
                  27.0178, 75.8942
                </span>
                <span th:if="${att.checkInLat == null}">--</span>
              </td>
              <td th:text="${att.checkOutTime != null ? #temporals.format(att.checkOutTime, 'hh:mm a') : '--'}">--</td>
              <td>
                <span th:if="${att.checkOutTime != null}" class="status-pill pill-success">Completed</span>
                <span th:if="${att.checkOutTime == null}" class="status-pill pill-warning">In Campus</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="/student/dashboard" class="bottom-nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Dashboard</span>
    </a>
    <a href="/student/check-in" class="bottom-nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Check In</span>
    </a>
    <a href="/student/history" class="bottom-nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span>History</span>
    </a>
    <a href="/terms" class="bottom-nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      <span>Terms</span>
    </a>
  </nav>

  <script src="/js/extremis.js"></script>
</body>
</html>
