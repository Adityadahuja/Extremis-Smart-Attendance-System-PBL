<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- Fixed Bottom Navigation on ALL student screens (PRD Design System) -->
  <nav th:fragment="bottom-nav(activeTab)" class="student-bottom-nav">
    <!-- Home Tab -->
    <a href="/student/dashboard" class="student-nav-item" th:classappend="${activeTab == 'home'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Home</span>
    </a>

    <!-- Report Tab -->
    <a href="/student/report" class="student-nav-item" th:classappend="${activeTab == 'report'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      <span>Report</span>
    </a>

    <!-- Profile Tab -->
    <a href="/student/profile" class="student-nav-item" th:classappend="${activeTab == 'profile'} ? ' active' : ''">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Profile</span>
    </a>
  </nav>
</body>
</html>
