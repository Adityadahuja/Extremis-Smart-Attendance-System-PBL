<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Department Attendance Log - Extremis</title>
  <link rel="stylesheet" href="/css/extremis.css">
</head>
<body>

  <!-- Top App Header -->
  <header class="app-header">
    <div class="brand-wrapper">
      <a href="/faculty/dashboard" style="color: #fff; font-size: 1.25rem; margin-right: 0.25rem;">&larr;</a>
      <div class="brand-name">Attendance Log</div>
      <span class="brand-badge badge-faculty" th:text="${department}">CS</span>
    </div>

    <nav class="desktop-nav">
      <a href="/faculty/dashboard" class="nav-link">Dashboard</a>
      <a href="/faculty/students" class="nav-link">Students</a>
      <a href="/faculty/attendance" class="nav-link active">Attendance Log</a>
    </nav>

    <div class="header-actions">
      <form th:action="@{/faculty/logout}" method="post" style="display: inline;">
        <button type="submit" class="btn-logout">Exit</button>
      </form>
    </div>
  </header>

  <main class="container">
    
    <!-- Filter form -->
    <div class="card" style="padding: 1rem;">
      <form th:action="@{/faculty/attendance}" method="get" style="display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 180px;">
          <label class="form-label" for="date">Select Date</label>
          <input type="date" id="date" name="date" class="form-control" th:value="${selectedDate}">
        </div>
        <button type="submit" class="btn btn-primary" style="height: 46px;">
          Filter Records
        </button>
      </form>
    </div>

    <!-- Attendance table -->
    <div class="card">
      <div class="card-header">
        <div>
          <h2 class="card-title">Attendance Records</h2>
          <div class="card-subtitle" th:text="'Showing for: ' + ${selectedDate}">Date</div>
        </div>
        <span class="status-pill pill-info" th:text="${#lists.size(records)} + ' Found'">0 Found</span>
      </div>

      <div th:if="${#lists.isEmpty(records)}" style="text-align: center; padding: 2.5rem 1rem; color: var(--text-muted);">
        No attendance records found for this date.
      </div>

      <div th:if="${!#lists.isEmpty(records)}" class="table-wrapper">
        <table class="table">
          <thead>
            <tr>
              <th>Student Name</th>
              <th>Roll / Code</th>
              <th>Check In</th>
              <th>Check Out</th>
              <th>Status</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="r : ${records}">
              <td><strong th:text="${r.student.fullName}">Aarav Gupta</strong></td>
              <td><code th:text="${r.student.username}">STU2024001</code></td>
              <td th:text="${#temporals.format(r.checkInTime, 'hh:mm a')}">09:12 AM</td>
              <td th:text="${r.checkOutTime != null ? #temporals.format(r.checkOutTime, 'hh:mm a') : '--'}">--</td>
              <td>
                <span th:if="${r.checkOutTime != null}" class="status-pill pill-info">Completed</span>
                <span th:if="${r.checkOutTime == null}" class="status-pill pill-success">In Campus</span>
              </td>
              <td>
                <a th:href="@{'/faculty/attendance/' + ${r.id}}" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.78rem; min-height: 32px;">
                  🔍 Photo & GPS
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="bottom-nav">
    <a href="/faculty/dashboard" class="bottom-nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="/faculty/students" class="bottom-nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <span>Students</span>
    </a>
    <a href="/faculty/attendance" class="bottom-nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
      <span>Attendance</span>
    </a>
  </nav>

  <script src="/js/extremis.js"></script>
</body>
</html>
