<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Department Students - Extremis</title>
  <link rel="stylesheet" href="/css/extremis.css">
</head>
<body>

  <!-- Top App Header -->
  <header class="app-header">
    <div class="brand-wrapper">
      <a href="/faculty/dashboard" style="color: #fff; font-size: 1.25rem; margin-right: 0.25rem;">&larr;</a>
      <div class="brand-name">Students</div>
      <span class="brand-badge badge-faculty" th:text="${department}">CS</span>
    </div>

    <nav class="desktop-nav">
      <a href="/faculty/dashboard" class="nav-link">Dashboard</a>
      <a href="/faculty/students" class="nav-link active">Students</a>
      <a href="/faculty/attendance" class="nav-link">Attendance Log</a>
    </nav>

    <div class="header-actions">
      <form th:action="@{/faculty/logout}" method="post" style="display: inline;">
        <button type="submit" class="btn-logout">Exit</button>
      </form>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div class="card-header">
        <div>
          <h2 class="card-title">Enrolled Students</h2>
          <div class="card-subtitle" th:text="'Department: ' + ${department}">Department Students</div>
        </div>
        <span class="status-pill pill-info" th:text="${#lists.size(students)} + ' Enrolled'">0 Enrolled</span>
      </div>

      <div class="table-wrapper">
        <table class="table">
          <thead>
            <tr>
              <th>#</th>
              <th>Student Roll / Code</th>
              <th>Full Name</th>
              <th>Department</th>
              <th>Registered Since</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="s, stat : ${students}">
              <td th:text="${stat.count}">1</td>
              <td><code th:text="${s.username}">STU2024001</code></td>
              <td><strong th:text="${s.fullName}">Aarav Gupta</strong></td>
              <td th:text="${s.department}">Computer Science</td>
              <td th:text="${#temporals.format(s.createdAt, 'dd MMM yyyy')}">10 Oct 2026</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="bottom-nav">
    <a href="/faculty/dashboard" class="bottom-nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="/faculty/students" class="bottom-nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <span>Students</span>
    </a>
    <a href="/faculty/attendance" class="bottom-nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
      <span>Attendance</span>
    </a>
  </nav>

  <script src="/js/extremis.js"></script>
</body>
</html>
