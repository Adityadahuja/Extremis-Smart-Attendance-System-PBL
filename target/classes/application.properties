# ==============================================================================
# EXTREMIS ATTENDANCE SYSTEM CONFIGURATION
# ==============================================================================

# Server HTTP Port
server.port=8088

# ==============================================================================
# DATABASE CONFIGURATION
# Default: SQLite (portable, zero-config file database)
# ==============================================================================
spring.datasource.url=jdbc:sqlite:extremis.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ------------------------------------------------------------------------------
# Alternative: MySQL Configuration (Uncomment to use MySQL)
# ------------------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/extremis_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=rootpassword
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================================================================
# FILE UPLOAD & STORAGE CONFIGURATION
# ==============================================================================
app.upload.dir=uploads/photos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==============================================================================
# BUSINESS RULES CONFIGURATION
# ==============================================================================
# Student Session Timeout in minutes of inactivity (PRD Section 3)
app.session.timeout-minutes=30

# Maximum allowed GPS accuracy radius in meters (PRD Section 5)
app.geofence.max-accuracy-meters=100.0

# ==============================================================================
# ATTENDANCE TIME WINDOWS & BUSINESS RULES (Server Enforced)
# ==============================================================================
attendance.checkin.start=08:50
attendance.checkin.end=09:05
attendance.checkout.start=15:40
attendance.checkout.end=23:59
attendance.lectures-per-day=5

# Scheduled job cron for auto-marking absent students (18:00 daily)
attendance.auto-absent.cron=0 0 18 * * ?

# ==============================================================================
# THYMELEAF CONFIGURATION
# ==============================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ==============================================================================
# HTTPS / SSL CONFIGURATION (For phone testing over Wi-Fi on port 8443)
# To enable HTTPS, generate a keystore (see README) and uncomment the lines below:
# ==============================================================================
# server.port=8443
# server.ssl.key-store-type=PKCS12
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=changeit
# server.ssl.key-alias=extremis
# server.ssl.enabled=true
