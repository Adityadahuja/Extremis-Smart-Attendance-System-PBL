<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied - Extremis</title>
  <link rel="stylesheet" href="/css/extremis.css">
</head>
<body>

  <header class="app-header">
    <div class="brand-wrapper">
      <div class="brand-logo">E</div>
      <div class="brand-name">Extremis</div>
    </div>
  </header>

  <main class="container" style="max-width: 480px; padding: 3rem 1rem; text-align: center;">
    <div class="card" style="border-top: 4px solid var(--danger);">
      <div style="font-size: 3rem; margin-bottom: 0.75rem;">⛔</div>
      <h1 style="font-size: 1.5rem; color: #fff; margin-bottom: 0.5rem;">Access Denied (403)</h1>
      <p style="font-size: 0.92rem; color: var(--text-secondary); margin-bottom: 1.5rem;"
         th:text="${customMessage != null ? customMessage : 'You do not have permission to view this page or perform this action. Cross-role portal access is strictly prohibited.'}">
        You do not have permission to access this resource.
      </p>

      <div style="display: flex; flex-direction: column; gap: 0.75rem;">
        <a href="/" class="btn btn-primary">Return to Portal Selection</a>
      </div>
    </div>
  </main>

</body>
</html>
