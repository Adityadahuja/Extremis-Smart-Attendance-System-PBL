<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login - Extremis</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#dc2626">
  <link rel="stylesheet" href="/css/extremis.css">
</head>
<body style="background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 100%);">

  <header class="app-header">
    <div class="brand-wrapper">
      <div class="brand-logo">E</div>
      <div class="brand-name">Extremis</div>
      <span class="brand-badge badge-admin">Admin</span>
    </div>
    <div>
      <a href="/" class="nav-link" style="font-size: 0.85rem;">Portals</a>
    </div>
  </header>

  <main class="container" style="max-width: 420px; padding: 2rem 1.25rem;">

    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div style="display: inline-flex; width: 56px; height: 56px; border-radius: 16px; background: var(--danger-bg); color: var(--primary); align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 0.75rem;">
        🛡️
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 800; color: #fff;">Administrator Login</h1>
      <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">
        Master System Management Portal
      </p>
    </div>

    <!-- Alert Messages -->
    <div th:if="${errorMessage}" class="alert alert-danger">
      <span style="font-size: 1.2rem;">⚠️</span>
      <span th:text="${errorMessage}">Error message</span>
    </div>

    <div th:if="${successMessage}" class="alert alert-success">
      <span style="font-size: 1.2rem;">✓</span>
      <span th:text="${successMessage}">Success message</span>
    </div>

    <div class="card" style="box-shadow: var(--shadow-lg);">
      <form th:action="@{/admin/login-process}" method="post">
        
        <div class="form-group">
          <label class="form-label" for="username">Admin Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="e.g. admin" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Admin Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter admin password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-danger btn-block" style="margin-top: 1.5rem;">
          Sign In as Administrator &rarr;
        </button>

      </form>
    </div>

    <!-- Demo Credentials Helper -->
    <div class="card" style="background: rgba(19, 28, 46, 0.5); border: 1px dashed var(--border-color); padding: 1rem;">
      <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 0.4rem; text-transform: uppercase;">
        Demo Admin Account:
      </div>
      <div style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.5;">
        <div><strong>Username:</strong> <code>admin</code></div>
        <div><strong>Password:</strong> <code>AdminPassword123!</code></div>
      </div>
    </div>

  </main>

  <script src="/js/extremis.js"></script>
</body>
</html>
