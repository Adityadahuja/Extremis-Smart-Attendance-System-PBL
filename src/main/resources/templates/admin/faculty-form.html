<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${facultyDto.id != null ? 'Edit Faculty - Extremis Admin' : 'New Faculty - Extremis Admin'}">Faculty Form - Extremis</title>
  <link rel="stylesheet" href="/css/extremis.css">
</head>
<body>

  <!-- Top App Header -->
  <header class="app-header">
    <div class="brand-wrapper">
      <a href="/admin/faculty" style="color: #fff; font-size: 1.25rem; margin-right: 0.25rem;">&larr;</a>
      <div class="brand-name" th:text="${facultyDto.id != null ? 'Edit Faculty' : 'Add Faculty'}">Faculty Form</div>
      <span class="brand-badge badge-admin">Admin</span>
    </div>
  </header>

  <main class="container" style="max-width: 520px; padding: 1.5rem 1rem;">

    <div th:if="${errorMessage}" class="alert alert-danger">
      <span style="font-size: 1.1rem;">⚠️</span>
      <span th:text="${errorMessage}">Error message</span>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 class="card-title" th:text="${facultyDto.id != null ? 'Edit Faculty Member' : 'Register Faculty Member'}">Faculty Information</h2>
      </div>

      <form th:action="@{/admin/faculty/save}" th:object="${facultyDto}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
          <label class="form-label" for="username">Faculty Username / ID *</label>
          <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="e.g. faculty.ece" required>
          <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color: var(--danger); font-size: 0.78rem;">Error</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="fullName">Full Name *</label>
          <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="e.g. Dr. Anil Kumar" required>
          <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" style="color: var(--danger); font-size: 0.78rem;">Error</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="department">Department *</label>
          <input type="text" id="department" th:field="*{department}" class="form-control" placeholder="e.g. Computer Science" required>
          <span th:if="${#fields.hasErrors('department')}" th:errors="*{department}" style="color: var(--danger); font-size: 0.78rem;">Error</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            Password 
            <span th:if="${facultyDto.id != null}" style="font-weight: 400; font-size: 0.8rem; color: var(--text-muted);">(Leave blank to keep current)</span>
            <span th:if="${facultyDto.id == null}" style="font-weight: 400; font-size: 0.8rem; color: var(--text-muted);">(Default: FacultyPassword123!)</span>
          </label>
          <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Set password">
        </div>

        <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
          <a href="/admin/faculty" class="btn btn-secondary" style="flex: 1;">Cancel</a>
          <button type="submit" class="btn btn-warning" style="flex: 2; color: #000; font-weight: 700;">Save Faculty</button>
        </div>

      </form>
    </div>

  </main>

  <script src="/js/extremis.js"></script>
</body>
</html>
