<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Faculty - Extremis Admin</title>
  <link rel="stylesheet" href="/css/extremis.css">
</head>
<body>

  <!-- Top App Header -->
  <header class="app-header">
    <div class="brand-wrapper">
      <a href="/admin/dashboard" style="color: #fff; font-size: 1.25rem; margin-right: 0.25rem;">&larr;</a>
      <div class="brand-name">Faculty</div>
      <span class="brand-badge badge-admin">Admin</span>
    </div>

    <nav class="desktop-nav">
      <a href="/admin/dashboard" class="nav-link">Dashboard</a>
      <a href="/admin/students" class="nav-link">Students</a>
      <a href="/admin/faculty" class="nav-link active">Faculty</a>
      <a href="/admin/attendance" class="nav-link">Attendance</a>
      <a href="/admin/sessions" class="nav-link">Sessions</a>
      <a href="/admin/geofences" class="nav-link">Geofences</a>
    </nav>

    <div class="header-actions">
      <form th:action="@{/admin/logout}" method="post" style="display: inline;">
        <button type="submit" class="btn-logout">Exit</button>
      </form>
    </div>
  </header>

  <main class="container">

    <div th:if="${successMessage}" class="alert alert-success">
      <span style="font-size: 1.1rem;">✓</span>
      <span th:text="${successMessage}">Success</span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger">
      <span style="font-size: 1.1rem;">⚠️</span>
      <span th:text="${errorMessage}">Error</span>
    </div>

    <div class="card">
      <div class="card-header">
        <div>
          <h2 class="card-title">Faculty Members</h2>
          <div class="card-subtitle">Manage teaching staff & department heads</div>
        </div>
        <a href="/admin/faculty/new" class="btn btn-warning" style="font-size: 0.85rem; padding: 0.5rem 1rem; color: #000; font-weight: 700;">
          + Add Faculty Member
        </a>
      </div>

      <div class="table-wrapper">
        <table class="table">
          <thead>
            <tr>
              <th>Username</th>
              <th>Full Name</th>
              <th>Assigned Department</th>
              <th>Created On</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="f : ${facultyList}">
              <td><code th:text="${f.username}">faculty.cs</code></td>
              <td><strong th:text="${f.fullName}">Dr. Rajesh Sharma</strong></td>
              <td th:text="${f.department}">Computer Science</td>
              <td th:text="${#temporals.format(f.createdAt, 'dd MMM yyyy')}">10 Oct 2026</td>
              <td style="text-align: right;">
                <div style="display: inline-flex; gap: 0.5rem;">
                  <a th:href="@{'/admin/faculty/' + ${f.id} + '/edit'}" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.78rem; min-height: 32px;">
                    Edit
                  </a>
                  <form th:action="@{'/admin/faculty/' + ${f.id} + '/delete'}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this faculty member?');">
                    <button type="submit" class="btn btn-danger" style="padding: 4px 10px; font-size: 0.78rem; min-height: 32px;">
                      Delete
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="/js/extremis.js"></script>
</body>
</html>
