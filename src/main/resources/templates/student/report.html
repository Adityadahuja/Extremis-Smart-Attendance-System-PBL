<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance Report - Extremis</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1F5FD9">
  <link rel="stylesheet" href="/css/extremis.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .view-toggle-btn {
      flex: 1;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid #1E2D4A;
      background: #111A2E;
      color: #94A3B8;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .view-toggle-btn.active {
      background: linear-gradient(135deg, #0066FF 0%, #0052CC 100%);
      color: #FFFFFF;
      box-shadow: 0 2px 14px rgba(0, 102, 255, 0.5);
      border-color: #38BDF8;
    }
  </style>
</head>
<body class="student-app">

  <div class="student-mobile-shell">

    <!-- Screen 3 / Screen 7 Header: Back arrow + Dynamic Title -->
    <header class="student-header">
      <div style="display: flex; align-items: center; gap: 0.85rem;">
        <a href="/student/dashboard" class="back-link" title="Back to Dashboard" aria-label="Back">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </a>
        <div class="page-heading" id="reportHeadingText" th:text="${selectedView == 'calendar' ? 'Monthly Attendance' : 'Attendance Report'}">Attendance Report</div>
      </div>
      <a href="/student/notifications" class="bell-btn" title="Notifications">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span th:if="${hasUnreadNotices}" class="dot-badge"></span>
      </a>
    </header>

    <!-- Main Content Container -->
    <main class="student-content">

      <!-- Month Selector & Filter Dropdown Form -->
      <div style="display: flex; gap: 10px; margin-bottom: 0.5rem;">
        <!-- Month Selector (Calendar icon + October 2026 + chevron down) -->
        <div style="flex: 3; position: relative;">
          <form method="get" action="/student/report" id="reportMonthForm">
            <input type="hidden" name="filter" th:value="${selectedFilter}">
            <div class="mockup-dropdown-pill">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
              <select name="month" class="pill-select-input" onchange="this.form.submit()">
                <option value="2026-10" th:selected="${selectedMonth.toString() == '2026-10'}">October 2026</option>
                <option value="2026-09" th:selected="${selectedMonth.toString() == '2026-09'}">September 2026</option>
                <option value="2026-08" th:selected="${selectedMonth.toString() == '2026-08'}">August 2026</option>
                <option value="2026-11" th:selected="${selectedMonth.toString() == '2026-11'}">November 2026</option>
              </select>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
          </form>
        </div>

        <!-- Filter Dropdown (All / Present / Absent / OD + chevron down) -->
        <div style="flex: 2; position: relative;">
          <form method="get" action="/student/report" id="reportFilterForm">
            <input type="hidden" name="month" th:value="${selectedMonth}">
            <div class="mockup-dropdown-pill">
              <select name="filter" class="pill-select-input" onchange="this.form.submit()">
                <option value="ALL" th:selected="${selectedFilter == 'ALL'}">All</option>
                <option value="PRESENT" th:selected="${selectedFilter == 'PRESENT'}">Present</option>
                <option value="ABSENT" th:selected="${selectedFilter == 'ABSENT'}">Absent</option>
                <option value="OD" th:selected="${selectedFilter == 'OD'}">OD</option>
              </select>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
          </form>
        </div>
      </div>

      <!-- Four Summary Tiles (Present 22, Absent 3, OD 0, Total 25) -->
      <div class="report-summary-grid">
        <div class="report-stat-tile tile-green">
          <div class="report-tile-num num-green" th:text="${report.presentCount}">22</div>
          <div class="report-tile-label">Present</div>
        </div>

        <div class="report-stat-tile tile-red">
          <div class="report-tile-num num-red" th:text="${report.absentCount}">3</div>
          <div class="report-tile-label">Absent</div>
        </div>

        <div class="report-stat-tile tile-amber">
          <div class="report-tile-num num-amber" th:text="${report.odCount}">0</div>
          <div class="report-tile-label">OD</div>
        </div>

        <div class="report-stat-tile tile-blue">
          <div class="report-tile-num num-blue" th:text="${report.totalClasses}">25</div>
          <div class="report-tile-label">Total</div>
        </div>
      </div>

      <!-- View Switcher (List View vs. Monthly Calendar) -->
      <div style="display: flex; gap: 8px; background: #0B0F19; border: 1px solid #1E2D4A; padding: 4px; border-radius: 12px; margin-bottom: 0.85rem;">
        <button type="button" id="btnListView" class="view-toggle-btn active" onclick="switchView('list')">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"/>
            <line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/>
            <line x1="3" y1="12" x2="3.01" y2="12"/>
            <line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
          <span>List View</span>
        </button>
        <button type="button" id="btnCalendarView" class="view-toggle-btn" onclick="switchView('calendar')">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span>Monthly Calendar</span>
        </button>
      </div>

      <!-- VIEW 1: Table List View (Screen 3) -->
      <div id="listViewContainer" class="student-card" style="padding: 0; overflow: hidden;">
        <div style="overflow-x: auto;">
          <table class="mockup-report-table">
            <thead>
              <tr>
                <th style="padding-left: 1rem;">Date</th>
                <th>Check In</th>
                <th>Check Out</th>
                <th style="text-align: right; padding-right: 1rem;">Status</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="r : ${report.records}">
                <!-- Date formatted as '10 Oct' matching mockup -->
                <td style="padding-left: 1rem; font-weight: 700; color: #FFFFFF;" th:text="${#temporals.format(r.date, 'dd MMM')}">
                  10 Oct
                </td>
                <td style="color: #94A3B8;">
                  <span th:if="${r.checkInTime != null}" th:text="${#temporals.format(r.checkInTime, 'hh:mm a')}">08:52 AM</span>
                  <span th:if="${r.checkInTime == null}">—</span>
                </td>
                <td style="color: #94A3B8;">
                  <span th:if="${r.checkOutTime != null}" th:text="${#temporals.format(r.checkOutTime, 'hh:mm a')}">03:42 PM</span>
                  <span th:if="${r.checkOutTime == null}">—</span>
                </td>
                <td style="text-align: right; padding-right: 1rem;">
                  <span th:if="${r.status.name() == 'PRESENT'}" class="table-status-pill pill-present">Present</span>
                  <span th:if="${r.status.name() == 'ABSENT'}" class="table-status-pill pill-absent">Absent</span>
                  <span th:if="${r.status.name() == 'OD'}" class="table-status-pill pill-od">OD</span>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(report.records)}">
                <td colspan="4" style="text-align: center; padding: 2.5rem 1rem; color: #94A3B8;">
                  No attendance records found for this month and filter.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- VIEW 2: Monthly Calendar View (Screen 7: Monthly Attendance) -->
      <div id="calendarViewContainer" class="student-card calendar-view-card" style="display: none; padding: 1.25rem 1rem;">
        <!-- Calendar Month Navigation -->
        <div class="calendar-header">
          <a th:href="@{/student/report(month='2026-09', filter=${selectedFilter})}" class="calendar-nav-btn">&larr;</a>
          <h3 th:text="${#temporals.format(selectedMonth, 'MMMM yyyy')}">October 2026</h3>
          <a th:href="@{/student/report(month='2026-11', filter=${selectedFilter})}" class="calendar-nav-btn">&rarr;</a>
        </div>

        <!-- Weekdays Header (Sun - Sat with Sun in Red) -->
        <div class="calendar-weekdays">
          <div style="color: #EF4444; font-weight: 700;">Sun</div>
          <div>Mon</div>
          <div>Tue</div>
          <div>Wed</div>
          <div>Thu</div>
          <div>Fri</div>
          <div>Sat</div>
        </div>

        <!-- Calendar Days Grid (7 columns with day badges matching Screen 7) -->
        <div class="calendar-grid">
          <div th:each="day : ${report.calendarDays}" class="cal-day-cell">
            <!-- Day circle badge -->
            <div th:if="${day.dayNumber > 0}"
                 class="cal-circle-badge"
                 th:classappend="${day.sunday} ? ' circle-red' : (${day.today} ? ' circle-blue' : (${day.status == 'PRESENT'} ? ' circle-green' : (${day.status == 'OD'} ? ' circle-amber' : (${day.status == 'ABSENT'} ? ' circle-red' : ' circle-neutral'))))"
                 th:text="${day.dayNumber}">
              1
            </div>
            <!-- Blank padding cell for days outside month -->
            <div th:if="${day.dayNumber == 0}" class="cal-circle-badge circle-padding"></div>
          </div>
        </div>

        <!-- Legend Underneath (Screen 7 mockup: Present green, Absent red, Today blue, Not Marked gray) -->
        <div class="calendar-legend">
          <div class="legend-item"><span class="legend-dot dot-green"></span> <span>Present</span></div>
          <div class="legend-item"><span class="legend-dot dot-red"></span> <span>Absent</span></div>
          <div class="legend-item"><span class="legend-dot dot-blue"></span> <span>Today</span></div>
          <div class="legend-item"><span class="legend-dot dot-grey"></span> <span>Not Marked</span></div>
        </div>
      </div>

    </main>

    <!-- Fixed Bottom Navigation (PRD: Report active) -->
    <div th:replace="~{fragments/student-nav :: bottom-nav('report')}"></div>

  </div>

  <script src="/js/extremis.js"></script>
  <script th:inline="javascript">
    const initialView = /*[[${selectedView}]]*/ 'list';

    function switchView(view) {
      const listContainer = document.getElementById('listViewContainer');
      const calendarContainer = document.getElementById('calendarViewContainer');
      const btnList = document.getElementById('btnListView');
      const btnCal = document.getElementById('btnCalendarView');
      const heading = document.getElementById('reportHeadingText');

      if (view === 'calendar') {
        listContainer.style.display = 'none';
        calendarContainer.style.display = 'block';
        if (btnList) btnList.classList.remove('active');
        if (btnCal) btnCal.classList.add('active');
        if (heading) heading.innerText = 'Monthly Attendance';
      } else {
        listContainer.style.display = 'block';
        calendarContainer.style.display = 'none';
        if (btnCal) btnCal.classList.remove('active');
        if (btnList) btnList.classList.add('active');
        if (heading) heading.innerText = 'Attendance Report';
      }
    }

    if (initialView === 'calendar') {
      switchView('calendar');
    }
  </script>
</body>
</html>
