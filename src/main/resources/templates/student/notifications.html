<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notifications - Extremis</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1F5FD9">
  <link rel="stylesheet" href="/css/extremis.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="student-app">

  <div class="student-mobile-shell">

    <!-- Screen 2 Header: Back arrow + Title "Notifications" -->
    <header class="student-header">
      <div style="display: flex; align-items: center; gap: 0.85rem;">
        <a href="/student/dashboard" class="back-link" title="Back to Dashboard" aria-label="Back">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </a>
        <div class="page-heading">Notifications</div>
      </div>
      <div style="font-size: 0.8rem; color: #64748B; font-weight: 600;" th:text="${#lists.size(notices)} + ' Notices'">
        3 Notices
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="student-content">

      <!-- List of Notice Cards matching Mockup Screen 2 -->
      <div th:each="n : ${notices}" class="notice-card" th:classappend="${!n.read} ? ' unread' : ''">
        <div class="notice-card-inner">
          <!-- Left Icon Box -->
          <div class="notice-icon-box"
               th:classappend="${n.category.name() == 'IMPORTANT'} ? ' icon-box-red' : (${n.category.name() == 'ACADEMIC'} ? ' icon-box-green' : ' icon-box-blue')">
            <!-- Megaphone for IMPORTANT -->
            <svg th:if="${n.category.name() == 'IMPORTANT'}" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <!-- Calendar for ACADEMIC -->
            <svg th:if="${n.category.name() == 'ACADEMIC'}" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <!-- Info for GENERAL -->
            <svg th:if="${n.category.name() == 'GENERAL'}" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
          </div>

          <!-- Notice Content -->
          <div class="notice-body-wrap">
            <div class="notice-top-row">
              <!-- Category Tag Badge -->
              <span th:if="${n.category.name() == 'IMPORTANT'}" class="notice-badge-important">Important</span>
              <span th:if="${n.category.name() == 'GENERAL'}" class="notice-badge-general">General</span>
              <span th:if="${n.category.name() == 'ACADEMIC'}" class="notice-badge-academic">Academic</span>

              <!-- Date on the Right -->
              <span class="notice-date-text" th:text="${n.formattedDate}">10 Oct 2026</span>
            </div>

            <!-- Message Body matching Mockup -->
            <div class="notice-text-content" th:utext="${#strings.replace(#strings.escapeXml(n.message), '&#10;', '<br/>')}">
              Midterm exam form submission<br/>last date: 15 Oct 2026.
            </div>

            <!-- Optional Attachment -->
            <div th:if="${n.attachmentUrl != null and !#strings.isEmpty(n.attachmentUrl)}" style="margin-top: 0.4rem;">
              <a th:href="${n.attachmentUrl}" target="_blank" style="display: inline-flex; align-items: center; gap: 4px; font-size: 0.76rem; font-weight: 600; color: #38BDF8; text-decoration: none;">
                📎 <span>Attachment</span>
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Empty state if no notices -->
      <div th:if="${#lists.isEmpty(notices)}" style="text-align: center; padding: 3rem 1rem; color: #94A3B8;">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔔</div>
        <div style="font-size: 1rem; font-weight: 700; color: #FFFFFF;">No Notifications</div>
        <div style="font-size: 0.82rem; margin-top: 4px;">You are all caught up! Check back later for college updates.</div>
      </div>

    </main>

    <!-- Fixed Bottom Navigation on ALL student screens -->
    <div th:replace="~{fragments/student-nav :: bottom-nav('home')}"></div>

  </div>

  <script src="/js/extremis.js"></script>
</body>
</html>
