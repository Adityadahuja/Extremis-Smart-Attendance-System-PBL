<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Check In - Extremis</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1F5FD9">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <link rel="stylesheet" href="/css/extremis.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="student-app">

  <div class="student-mobile-shell">

    <!-- Screen 4 Header: Back Arrow + Title "Check In" -->
    <header class="student-header">
      <div style="display: flex; align-items: center; gap: 0.85rem;">
        <a href="/student/dashboard" class="back-link" title="Back to Dashboard" aria-label="Back">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </a>
        <div class="page-heading">Check In</div>
      </div>
      <div style="font-size: 0.8rem; font-weight: 700; color: #38BDF8;">
        Arya Campus
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="student-content">

      <!-- Toast / Error Alert -->
      <div id="statusAlert" class="alert alert-danger" style="display: none; border-radius: 12px; margin-bottom: 0; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35); color: #F87171;">
        <span style="font-size: 1.1rem;">⚠️</span>
        <span id="statusAlertMsg">Error details</span>
      </div>

      <!-- CARD 1: Location Captured (GPS High Accuracy) -->
      <div class="capture-card">
        <div class="capture-card-header">
          <div class="capture-card-title">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            <span>Location Captured</span>
          </div>

          <!-- Status Indicator Icon -->
          <div id="locStatusIcon">
            <div class="spinner" style="width: 20px; height: 20px; border-width: 2px;"></div>
          </div>
        </div>

        <!-- Location Waiting State -->
        <div id="locWaitingBox" style="font-size: 0.84rem; color: #94A3B8; display: flex; align-items: center; gap: 8px; padding: 0.5rem 0;">
          <div class="spinner" style="width: 16px; height: 16px; border-width: 2px; border-color: rgba(56,189,248,0.2); border-top-color: #38BDF8;"></div>
          <span>Getting your location…</span>
        </div>

        <!-- Location Captured State (Lat/Lng to 4 decimals + Accuracy: N m) -->
        <div id="locCapturedBox" style="display: none; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.35); border-radius: 10px; padding: 0.75rem 0.9rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <div style="font-size: 0.88rem; font-weight: 700; color: #34D399;">
              Lat: <span id="displayLat">--</span>, Lng: <span id="displayLng">--</span>
            </div>
            <div style="display: flex; align-items: center; gap: 4px; color: #10B981; font-weight: 700; font-size: 0.78rem;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              <span>Captured</span>
            </div>
          </div>
          <div style="font-size: 0.76rem; color: #A7F3D0;">
            Accuracy: <strong id="displayAcc">--</strong> m &bull; Inside College Geofence
          </div>
        </div>
      </div>

      <!-- CARD 2: Photo Captured (Front Camera, getUserMedia, Live Preview, Canvas Snapshot) -->
      <div class="capture-card">
        <div class="capture-card-header">
          <div class="capture-card-title">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
            <span>Photo Captured</span>
          </div>

          <!-- Status Indicator Icon -->
          <div id="photoStatusIcon">
            <span style="font-size: 0.76rem; color: #94A3B8; font-weight: 600;" id="photoStatusText">Pending</span>
          </div>
        </div>

        <!-- Camera Preview & Photo Viewport -->
        <div class="camera-preview-box">
          <video id="cameraPreview" autoplay playsinline muted></video>
          <img id="capturedImage" style="display: none;" alt="Captured Selfie">
          <canvas id="photoCanvas" style="display: none;"></canvas>
        </div>

        <!-- Camera Controls -->
        <div style="display: flex; gap: 8px; margin-top: 0.75rem;">
          <button type="button" id="btnCapturePhoto" class="btn btn-secondary" style="flex: 1; height: 44px; font-weight: 700; background: #16223B; color: #38BDF8; border: 1px solid #1E2D4A;" onclick="takePhoto()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="12" cy="12" r="4"/>
            </svg>
            <span>Capture Photo</span>
          </button>

          <button type="button" id="btnRetakePhoto" class="btn btn-secondary" style="display: none; flex: 1; height: 44px; font-weight: 700; background: #16223B; color: #94A3B8; border: 1px solid #1E2D4A;" onclick="retakePhoto()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
            <span>Retake</span>
          </button>
        </div>
      </div>

      <!-- BIG BLUE "Submit Check In" BUTTON -->
      <button type="button"
              id="btnSubmitCheckIn"
              class="btn btn-primary btn-block"
              style="height: 52px; font-size: 1.05rem; font-weight: 800; border-radius: 14px; margin-top: 0.5rem; background: linear-gradient(135deg, #0066FF 0%, #0052CC 100%); box-shadow: 0 4px 20px rgba(0, 102, 255, 0.5);"
              onclick="submitCheckIn()"
              disabled>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span>Submit Check In</span>
      </button>

    </main>

    <!-- Fixed Bottom Navigation (PRD: Home active) -->
    <div th:replace="~{fragments/student-nav :: bottom-nav('home')}"></div>

  </div>

  <script src="/js/extremis.js"></script>
  <script>
    let capturedPhotoBase64 = null;
    let capturedLocation = null;
    let videoStream = null;

    // Start GPS high-accuracy location tracking
    function initLocation() {
      if (!navigator.geolocation) {
        showError("Geolocation is not supported by your browser or requires HTTPS.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          capturedLocation = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: pos.coords.accuracy
          };

          document.getElementById('displayLat').innerText = capturedLocation.lat.toFixed(4);
          document.getElementById('displayLng').innerText = capturedLocation.lng.toFixed(4);
          document.getElementById('displayAcc').innerText = Math.round(capturedLocation.accuracy);

          document.getElementById('locWaitingBox').style.display = 'none';
          document.getElementById('locCapturedBox').style.display = 'block';

          document.getElementById('locStatusIcon').innerHTML = `
            <span style="color: #16A34A; display: flex; align-items: center;">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </span>
          `;

          checkFormReadiness();
        },
        (err) => {
          let msg = "Could not get your GPS location. Please allow location access in your browser settings.";
          if (err.code === 1) msg = "Location permission denied. Please enable Location in browser permissions.";
          else if (err.code === 2) msg = "GPS signal unavailable. Please ensure location is enabled.";
          else if (err.code === 3) msg = "GPS request timed out. Please try again.";
          showError(msg);
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    // Start Front Camera live preview
    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError("Camera is not available. Please ensure HTTPS or localhost is used.");
        return;
      }

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        const video = document.getElementById('cameraPreview');
        video.srcObject = videoStream;
        await video.play();
      } catch (err) {
        showError("Camera access denied or unavailable: " + err.message);
      }
    }

    // Take live camera snapshot
    function takePhoto() {
      const video = document.getElementById('cameraPreview');
      const canvas = document.getElementById('photoCanvas');
      const img = document.getElementById('capturedImage');

      if (!video || !video.videoWidth) {
        showError("Camera preview is not ready yet. Please wait.");
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      capturedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.85);

      img.src = capturedPhotoBase64;
      img.style.display = 'block';
      video.style.display = 'none';

      document.getElementById('btnCapturePhoto').style.display = 'none';
      document.getElementById('btnRetakePhoto').style.display = 'flex';

      document.getElementById('photoStatusIcon').innerHTML = `
        <span style="color: #16A34A; display: flex; align-items: center; gap: 3px; font-size: 0.76rem; font-weight: 700;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Captured
        </span>
      `;

      checkFormReadiness();
    }

    // Retake live photo
    function retakePhoto() {
      const video = document.getElementById('cameraPreview');
      const img = document.getElementById('capturedImage');

      capturedPhotoBase64 = null;
      img.style.display = 'none';
      video.style.display = 'block';

      document.getElementById('btnCapturePhoto').style.display = 'flex';
      document.getElementById('btnRetakePhoto').style.display = 'none';

      document.getElementById('photoStatusIcon').innerHTML = `
        <span style="font-size: 0.76rem; color: #64748B; font-weight: 600;">Pending</span>
      `;

      checkFormReadiness();
    }

    // Enable submit button once BOTH location and photo are ready
    function checkFormReadiness() {
      const btn = document.getElementById('btnSubmitCheckIn');
      if (capturedLocation && capturedPhotoBase64) {
        btn.disabled = false;
      } else {
        btn.disabled = true;
      }
    }

    function showError(msg) {
      const alertBox = document.getElementById('statusAlert');
      const msgBox = document.getElementById('statusAlertMsg');
      msgBox.innerText = msg;
      alertBox.style.display = 'flex';
    }

    // Submit Check In POST request
    async function submitCheckIn() {
      if (!capturedLocation || !capturedPhotoBase64) {
        showError("Both high-accuracy location and live photo are required.");
        return;
      }

      const btn = document.getElementById('btnSubmitCheckIn');
      btn.disabled = true;
      btn.innerHTML = `<div class="spinner" style="width: 20px; height: 20px; border-width: 2px;"></div> <span>Submitting Check In…</span>`;

      try {
        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        const payload = {
          lat: capturedLocation.lat,
          lng: capturedLocation.lng,
          accuracy: capturedLocation.accuracy,
          photo: capturedPhotoBase64
        };

        const res = await fetch('/student/api/check-in', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            [csrfHeader]: csrfToken
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.success) {
          // Stop camera stream
          if (videoStream) {
            videoStream.getTracks().forEach(t => t.stop());
          }
          window.location.href = '/student/dashboard';
        } else {
          showError(data.message || "Check-in failed. Please verify time window and geofence.");
          btn.disabled = false;
          btn.innerHTML = `<span>Submit Check In</span>`;
        }
      } catch (err) {
        showError("Network or server error: " + err.message);
        btn.disabled = false;
        btn.innerHTML = `<span>Submit Check In</span>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initLocation();
      startCamera();
    });

    window.addEventListener('beforeunload', () => {
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
      }
    });
  </script>
</body>
</html>
