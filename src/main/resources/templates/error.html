<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Notice - Extremis</title>
  <link rel="stylesheet" href="/css/extremis.css">
</head>
<body>

  <header class="app-header">
    <div class="brand-wrapper">
      <div class="brand-logo">E</div>
      <div class="brand-name">Extremis</div>
    </div>
  </header>

  <main class="container" style="max-width: 480px; padding: 3rem 1rem; text-align: center;">
    <div class="card" style="border-top: 4px solid var(--warning);">
      <div style="font-size: 3rem; margin-bottom: 0.75rem;">⚠️</div>
      <h1 style="font-size: 1.4rem; color: #fff; margin-bottom: 0.5rem;">System Notice</h1>
      <p style="font-size: 0.92rem; color: var(--text-secondary); margin-bottom: 1.5rem;"
         th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred. Please try again.'}">
        An error occurred.
      </p>

      <div style="display: flex; gap: 0.75rem; justify-content: center;">
        <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
        <a href="/" class="btn btn-primary">Home</a>
      </div>
    </div>
  </main>

</body>
</html>
